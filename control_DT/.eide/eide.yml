version: "4.1"
name: WirelessSwitch
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Drivers
  - Core
  - build
virtualFolder:
  name: <virtual_root>
  files:
    - path: STM32G431XX_FLASH.ld
    - path: startup_stm32g431xx.s
    - path: Makefile
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 99c8e05ee7250d6f907b0ad24bd63b82
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32G431xx
      incList:
        - Core/Inc
        - Drivers/CMSIS/Include
        - Drivers/CMSIS/Device/ST/STM32G4xx/Include
        - Drivers/STM32G4xx_HAL_Driver/Inc/Legacy
        - Drivers/STM32G4xx_HAL_Driver/Inc
      libList: []
    excludeList: []
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32G431XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
